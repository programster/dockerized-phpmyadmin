# This is the apache config as it will appear for the deployed container. Bear in mind that this
# does not overwrite anything on the host that the container is deployed to so everything is "safe"
#
# This will need to match up with how files are added to the container from the Dockerfile
NameVirtualHost *:443

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /ssl/cert.pem
    SSLCertificateKeyFile /ssl/privkey.pem
    SSLCertificateChainFile /ssl/chain.pem

    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/site/phpmyadmin
    <Directory /var/www/site/phpmyadmin/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Order allow,deny
        allow from all
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/apache-error.log

    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    LogLevel warn

    CustomLog /var/log/apache2/apache-access.log combined

</VirtualHost>
