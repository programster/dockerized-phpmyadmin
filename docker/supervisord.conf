[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisor.log
logfile_maxbytes=10MB
logfile_backups=10
childlogdir=/var/log/supervisor

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND

autorestart=true
startretries=999999
startsecs=5
user=root
priority=100
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

[supervisorctl]
